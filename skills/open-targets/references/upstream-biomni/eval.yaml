# --- Verified resources ---
verified_resources:
  - name: Open Targets Platform GraphQL API
    uri: https://api.platform.opentargets.org/api/v4/graphql
    access_date: "2026-08-16"
    release_label: "26.06"
    api_version: "26.6.3"
    license: CC0 1.0 Universal (Public Domain Dedication)
    authentication: none
    verification_ref: references/licensing-and-access.md

# --- Package rationale ---
package_rationale: |
  The original open-targets package was a general-purpose conceptual skill with no
  production scripts, no eval suite, and no enforced provenance. This repair moves
  fragile network, pagination, provenance, semantic typing, validation, and
  visualization behavior into deterministic package code with one offline test per
  observed defect. The package stays customer-neutral and does not add raw GWAS
  summary-statistics retrieval, causal inference, clinical recommendations, or
  controlled-access data.

# --- Commercial-use statuses ---
commercial_use:
  open_targets_data:
    status: permitted
    basis: "CC0 1.0 Universal (Public Domain Dedication)"
    caveat: "Data is public domain; API terms do not constitute a commercial-use contract. Verify current terms before commercial deployment."
  gwas_catalog:
    status: permitted
    basis: "CC0 1.0 (integrated by Open Targets, not retrieved directly)"
    caveat: "Retrieved through the Open Targets API; direct GWAS Catalog access has its own terms."
  api_service:
    status: unknown
    basis: "No authentication required; no published rate-limit or SLA guarantee"
    caveat: "Service stability and rate limits are not promised; do not infer unlimited use from missing headers."

# --- Scientific checks ---
scientific_checks:
  - id: score_semantics
    statement: "Association scores are integrated prioritization metrics (0-1), not effect estimates, replication, or causal proof."
    eval_ref: assets/eval/test_semantics.py
  - id: completeness_label
    statement: "Bounded samples are labelled bounded_sample, never exhaustive."
    eval_ref: assets/eval/test_pagination.py
  - id: study_disease_conflation
    statement: "GWAS study trait is not conflated with the queried EFO disease; non-concordant studies are labeled independent_study_context."
    eval_ref: assets/eval/test_repair_r2.py
  - id: infographic_qualitative
    statement: "The GenerateImage infographic carries no run-specific numbers, scores, rankings, variant IDs, or p-values."
    eval_ref: assets/eval/test_infographic.py
  - id: operation_count_honesty
    statement: "Executed-operation counts are derived from the ledger; five executed in the representative run, nine registered and separately smoke-tested."
    eval_ref: assets/eval/test_repair_r2.py
  - id: strict_json_payloads
    statement: "Machine-readable JSON artifacts contain no NaN or inf; non-finite values are null."
    eval_ref: assets/eval/test_repair_r2.py
  - id: pdf_hash_binding
    statement: "PDF review events are hash-bound to the current final-PDF SHA256 and artifact SHA256s."
    eval_ref: assets/eval/test_repair_r2.py
  - id: infographic_lineage
    statement: "A unique same-id GenerateImage call/result pair binds exact prompt, filenames, source-image hash, decoded-pixel hash, final PDF hash, and page-1 embedded-pixel hash."
    eval_ref: assets/eval/test_infographic.py
  - id: response_hash_lineage
    statement: "Every terminal API attempt records canonical request-body and exact received response-body hashes, including failures and explicit retry/recovery links."
    eval_ref: assets/eval/test_finalization_v1.py

# --- Known risks ---
known_risks:
  - risk: "API schema drift between releases may break pinned field selections."
    mitigation: "schema_smoke.py runs all nine operations; a removed/renamed field fails with the exact operation and field."
  - risk: "Bounded target samples are not exhaustive; over-reading rankings as a complete target list is a misuse."
    mitigation: "completeness field labels bounded_sample; report text states the bound."
  - risk: "L2G and colocalisation records have no datasource_id; treating them as evidence rows is a semantic error."
    mitigation: "Discriminated record_type with null datasource_id and explicit not-applicable reason."
  - risk: "The GenerateImage infographic is qualitative; it must not be read as a data figure."
    mitigation: "test_infographic.py rejects data-bearing prompts; build_report.py aborts on missing/blank/corrupt; content-identity embedding check verifies exact image."
  - risk: "Visual inspection of PDF pages is not_evaluable under a text-only model."
    mitigation: "record_pdf_review attests not_evaluable with exact blocker; pages are rendered programmatically and text is extracted."
  - risk: "A non-concordant GWAS study (e.g. CAD for Alzheimer) could be silently treated as disease-supporting evidence."
    mitigation: "study_concordance gate in run_analysis.py; non-concordant studies labeled independent_study_context and excluded from conclusions."
  - risk: "PDF review events could become stale if the PDF is overwritten after review."
    mitigation: "Every review event records pdf_sha256; _pdf_review_evidence verifies agreement with current PDF."
  - risk: "NaN values in figure payloads are not valid RFC JSON."
    mitigation: "visualize.py uses allow_nan=False and converts non-finite floats to null."

# --- Live smoke test (opt-in, never replaces offline evals) ---
live_smoke:
  command: "python3 scripts/schema_smoke.py --live"
  requires_network: true
  note: "Opt-in only. Runs all nine operations against the live API. Never replaces offline rejection tests."
